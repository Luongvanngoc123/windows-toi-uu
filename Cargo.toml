[package]
name = "velo"
version = "0.1.1"
edition = "2024"
description = "A native Rust Windows maintenance toolkit"
license = "MIT"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
sysinfo = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
